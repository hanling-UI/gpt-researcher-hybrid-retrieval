services:
  gpt-researcher:
    build:
      context: ./
      dockerfile: Dockerfile
    image: gpt-researcher-hybrid:local

    # 从 .env 读所有配置（key、模型名等）。注意 .env 已被 .dockerignore 排除，
    # 不会进镜像，只在运行时注入容器。
    env_file:
      - .env

    environment:
      # 本机跑容器：用 host.docker.internal 指向宿主机上的代理端口。
      # 部署到云端时要改回 "direct" —— 云服务器上没有这个代理。
      WEB_PROXY: "http://host.docker.internal:12450"
      HOST: 0.0.0.0
      PORT: 8000

    ports:
      - "8000:8000"

    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs

    restart: unless-stopped